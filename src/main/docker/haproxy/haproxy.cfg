global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s

frontend http-in
    bind *:8080

    # Define ACLs for API paths
    acl is_api path_beg /api
    acl is_auth path_beg /auth
    acl is_management path_beg /management
    acl is_swagger path_beg /v3/api-docs

    # Use backend based on path
    use_backend backend-api if is_api or is_auth or is_management or is_swagger

backend backend-api
    balance roundrobin
    option httpclose
    option forwardfor
    server-template backend 1-10 backend:8080 check resolvers docker init-addr none
