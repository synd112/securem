version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - /Users/vishalkumarbg/bootstrap/bootstrap/securem/target/classes/static:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - haproxy
    networks:
      - app-network

  haproxy:
    image: haproxy:2.4-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - '8081:8080' # Expose HAProxy on port 8081 for direct access if needed
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: securem:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/securem?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING_LIQUIBASE_URL=jdbc:mysql://mysql:3306/securem?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
    image: mysql:8.0.33
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=securem
    command: mysqld --lower_case_table_names=1 --skip-ssl --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
