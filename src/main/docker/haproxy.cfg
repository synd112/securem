global
    log /dev/log    local0
    log /dev/log    local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:80
    # Define an ACL for the stats URL path
    acl is_stats path_beg /haproxy/stats
    # Use the ACL to route stats requests to the stats backend
    use_backend stats_back if is_stats
    # All other requests go to the app backend
    default_backend http_back

# Stats backend definition
backend stats_back
    stats enable
    stats uri /haproxy/stats
    stats refresh 30s
    stats show-node
    stats show-legends
    stats auth admin:admin  # Change this to a secure username/password

# Application backend definition with DNS service discovery
backend http_back
    balance roundrobin
    option httpchk GET /management/health
    # Using DNS resolution for dynamic service discovery
    # HAProxy will resolve the DNS name "app" to all containers in the app service
    server-template app 10 app:8080 check resolvers docker init-addr none

# DNS resolver for Docker service discovery
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s
